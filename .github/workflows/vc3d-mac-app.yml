name: VC3D Mac app release
run-name: VC3D Mac app ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

# The downloadable VC3D for Mac and its Python tools, built on macOS 15 arm64 so both run on macOS 15 and later:
#   app      VC3D.app with every dylib and Qt plugin inside (.github/mac-app/build-app.sh), checked for leaked Homebrew
#            or build paths and launched with Homebrew hidden
#   wheels   the cp314 wheels, the hash-pinned requirements, the source tarball and the filled-in Python tools
#            installer, which is then run with Homebrew hidden and only the system's tools on PATH
#   release  puts the installer inside the app, signs it and builds the DMG (.github/mac-app/sign-app.sh). With the
#            Apple secrets below it signs with a Developer ID and notarizes the app and the DMG; without them it signs
#            ad hoc and says so. A pushed tag then publishes the release under that tag; a manual run only uploads the
#            files as an artifact
# Release tags look like vc3d-mac-YYYY.MM.DD, or vc3d-mac-YYYY.MM.DD-N for a later release that day. The installer
# downloads from this repository's release of that tag, so the tag is fixed when the release files are made.
#
# Secrets for a notarized release (all five, or none):
#   MACOS_CERTIFICATE_P12        base64 of a .p12 holding the Developer ID Application certificate and its key
#   MACOS_CERTIFICATE_PASSWORD   that .p12's password
#   NOTARY_API_KEY               the contents of an App Store Connect API key (.p8) allowed to notarize
#   NOTARY_API_KEY_ID            its key ID
#   NOTARY_API_ISSUER_ID         its issuer ID
# Variable (optional): VC3D_MAC_RUNNER, a macOS 15 arm64 runner label to use instead of macos-15

on:
  push:
    tags: ['vc3d-mac-*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag the installer downloads its files from, such as vc3d-mac-2026.11.26
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  # the oldest macOS the release supports: the runner's, whose Homebrew bottles are built for it
  MIN_MACOS: '15.0'
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  app:
    name: VC3D.app (macOS 15, arm64)
    runs-on: ${{ vars.VC3D_MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 300
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      SCCACHE_C_CUSTOM_CACHE_BUSTER: vc3d-mac-app-macos-15-arm64-v1
    steps:
      - uses: actions/checkout@v4

      - uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.15.0

      # one job per core: on GitHub's 3-core, 7 GB runner, VC3D's thin-LTO link alone peaks near 6 GB
      - name: Build and package VC3D.app
        run: |
          sysctl -n hw.ncpu hw.memsize
          /usr/bin/time -l .github/mac-app/build-app.sh "$RUNNER_TEMP/app" --install-deps --sccache \
            --jobs "$(sysctl -n hw.ncpu)"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/app/VC3D.app" "$RUNNER_TEMP/VC3D-mac-app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VC3D-mac-app
          path: ${{ runner.temp }}/VC3D-mac-app.zip
          if-no-files-found: error

      # the app's binaries must start with Homebrew gone
      - name: Start the app with Homebrew hidden
        timeout-minutes: 15
        run: |
          bin="$RUNNER_TEMP/app/VC3D.app/Contents/MacOS"
          sudo mv /opt/homebrew /opt/homebrew.hidden
          trap 'sudo mv /opt/homebrew.hidden /opt/homebrew' EXIT
          # no arguments prints usage and exits 1; anything else means a library failed to load
          set +e
          "$bin/vc_tifxyz2obj"; rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 1 ]] || { echo "::error::vc_tifxyz2obj failed to start (exit $rc)"; exit 1; }
          QT_QPA_PLATFORM=cocoa "$bin/VC3D" --version

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VC3D-mac-app-crash-reports
          path: ~/Library/Logs/DiagnosticReports/VC3D*
          if-no-files-found: ignore

  wheels:
    name: Python tools (macOS 15, arm64)
    runs-on: ${{ vars.VC3D_MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # the wheels build with Apple clang, and the C++ uses std::jthread, which libc++ before 20 only offers as
      # experimental (Xcode 16.4's does): take the newest Xcode, and the experimental library only if it still needs it
      - name: Choose the Xcode
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MIN_MACOS }}
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i -E "beta|release_candidate" | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          /usr/bin/clang++ --version | head -1
          probe="$RUNNER_TEMP/jthread.cpp"
          printf '#include <stop_token>\n#include <thread>\nint main() { std::jthread t([](std::stop_token) {}); }\n' > "$probe"
          if /usr/bin/clang++ -std=c++20 "$probe" -o "$RUNNER_TEMP/jthread"; then
            echo "$xcode has std::jthread"
          elif /usr/bin/clang++ -std=c++20 -fexperimental-library "$probe" -o "$RUNNER_TEMP/jthread"; then
            echo "$xcode has std::jthread with -fexperimental-library"
            echo "CXXFLAGS=-fexperimental-library" >> "$GITHUB_ENV"
          else
            echo "::error::no std::jthread in $xcode for macOS $MACOSX_DEPLOYMENT_TARGET"; exit 1
          fi
          "$RUNNER_TEMP/jthread"

      # the formulae scripts/build_macos.sh installs (the vc bindings build the same C++ tree), plus uv
      - name: Install build dependencies
        run: |
          brew install uv cmake ninja pkgconf ceres-solver eigen opencv c-blosc c-blosc2 concurrentqueue zstd lz4 boost \
            libtiff libpng jpeg-turbo curl nlohmann-json sqlite openssl@3 lapack openblas libomp scotch hwloc gcc flang \
            qtbase
          uv python install 3.14.10

      - name: Build a static OpenCV
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MIN_MACOS }}
        run: .github/mac-app/build-opencv.sh "$RUNNER_TEMP/opencv" "$(sysctl -n hw.ncpu)"

      # every torch the locks pin: the wheels must load the libomp each of them ships
      - name: Get torch's OpenMP runtimes
        run: |
          libomps=()
          for version in $(grep -h '^torch==' .github/mac-app/lock-inputs/*.in | cut -d= -f3 | sort -u); do
            uv venv --quiet --python 3.14.10 "$RUNNER_TEMP/torch-$version"
            uv pip install --quiet --python "$RUNNER_TEMP/torch-$version/bin/python" "torch==$version"
            libomps+=("$RUNNER_TEMP/torch-$version/lib/python3.14/site-packages/torch/lib/libomp.dylib")
          done
          ls -la "${libomps[@]}"
          echo "TORCH_LIBOMPS=${libomps[*]}" >> "$GITHUB_ENV"

      - name: Build the wheels
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MIN_MACOS }}
          OCV: ${{ runner.temp }}/opencv
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src"
          /usr/bin/time -l .github/mac-app/build-wheels.sh "$RUNNER_TEMP/src" "$RUNNER_TEMP/wheels-build" \
            "$(sysctl -n hw.ncpu)"

      - name: Assemble the release files
        run: |
          .github/mac-app/make-assets.sh . "$RUNNER_TEMP/wheels-build/wheels" "$RUNNER_TEMP/release" \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$MIN_MACOS"
          ls -la "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v4
        with:
          name: VC3D-mac-python-tools
          path: ${{ runner.temp }}/release
          if-no-files-found: error

      # the installer as a user runs it: no Homebrew, only the system's tools on PATH, a fresh home. The release files
      # come from this run, since the release is published only after these checks
      - name: Install the Python tools with Homebrew hidden
        timeout-minutes: 45
        run: |
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          tools="$home/Library/Application Support/Vesuvius Challenge/VC3D/python-tools"
          sudo mv /opt/homebrew /opt/homebrew.hidden
          trap 'sudo mv /opt/homebrew.hidden /opt/homebrew' EXIT
          release="$RUNNER_TEMP/release"
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin VC3D_TOOLS_ASSETS="$release" \
            bash "$release/install-python-tools.sh"
          check=.github/mac-app/omp_check.py
          env -i HOME="$home" "$tools/envs/lasagna/bin/python" -I $check vc.volume vc.fiber_trace vc_lasagna_amgx \
            vc_reader vc_object_store
          env -i HOME="$home" "$tools/envs/spiral/bin/python" -I $check vc_spiral.spiral_sampling vc_spiral.track_store \
            vc_reader vc_object_store posix_ipc
          env -i HOME="$home" "$tools/envs/vesuvius/bin/python" -I $check vc_reader vc_object_store
          # and again: nothing left to do
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin VC3D_TOOLS_ASSETS="$release" \
            bash "$release/install-python-tools.sh" | tee "$RUNNER_TEMP/second.log"
          [[ $(grep -c 'already up to date' "$RUNNER_TEMP/second.log") -eq 3 ]]

  release:
    name: Sign and publish
    needs: [app, wheels]
    runs-on: ${{ vars.VC3D_MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VC3D-mac-app
          path: ${{ runner.temp }}/app-zip

      - uses: actions/download-artifact@v4
        with:
          name: VC3D-mac-python-tools
          path: ${{ runner.temp }}/release

      # a temporary keychain with the Developer ID certificate, and the notary key in a file, both removed at the end
      - name: Set up signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          given=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            [[ -n ${!name} ]] && given=$((given + 1))
          done
          if [[ $given -eq 0 ]]; then
            echo "::warning::No Apple signing secrets: the app is signed ad hoc and not notarized"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ $given -eq 5 ]] || { echo "::error::set all five Apple signing secrets, or none"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # keep the user's keychains in the search list after this one
          read -r -a keychains <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [[ -n $identity ]] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "SIGNED=true"
            echo "SIGN_IDENTITY=$identity"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Sign the app and build the DMG
        run: |
          ditto -x -k "$RUNNER_TEMP/app-zip/VC3D-mac-app.zip" "$RUNNER_TEMP/app"
          release="$RUNNER_TEMP/release"
          .github/mac-app/sign-app.sh "$RUNNER_TEMP/app/VC3D.app" "$release/install-python-tools.sh" \
            "$RUNNER_TEMP/signed" "$RELEASE_TAG"
          cp "$RUNNER_TEMP"/signed/VC3D-mac-*.dmg "$release/"
          (cd "$release" && shasum -a 256 -- * > SHA256SUMS)
          ls -la "$release"

      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8"
          [[ ! -f "$RUNNER_TEMP/signing.keychain-db" ]] || security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      - uses: actions/upload-artifact@v4
        with:
          name: VC3D-mac-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

      # a release created with the workflow's token starts no other workflow, so the VC3D release workflows that
      # run on published releases do not add their packages to this one
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#vc3d-mac-}
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "VC3D for Apple-silicon Macs on macOS $MIN_MACOS or later, built from $GITHUB_SHA."
            echo
            echo "- **VC3D-mac-$version.dmg**: open it and drag VC3D-mac to Applications."
            if [[ $SIGNED == true ]]; then
              echo "  The app and the DMG are signed with a Developer ID and notarized by Apple."
            else
              echo "  This build is not notarized: the first time, right-click VC3D-mac and choose Open."
            fi
            echo "- **Python tools**: Spiral, Lasagna, sheet strips and fibre follow need them. VC3D offers to install"
            echo "  them the first time a feature needs them, or from Help > Install or Update Python Tools. They"
            echo "  install from the prebuilt packages below, with no compiler, Homebrew or conda. From Terminal:"
            echo "  \`bash install-python-tools.sh\`."
            echo "- **SHA256SUMS**: the checksums of every file here."
          } > "$notes"
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "VC3D for Mac $version" \
            --notes-file "$notes" "$RUNNER_TEMP"/release/*
